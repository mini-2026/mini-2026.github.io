<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://api.github.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>내 앱 모음</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e7e5e0;--acc:#2f6f4f;--new:#d9480f}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 72px;max-width:560px;margin:auto;-webkit-tap-highlight-color:transparent}
h1{font-size:22px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.re{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.nm{font-size:16px;font-weight:600}
.ds{font-size:13px;color:var(--sub);margin-top:2px}
.meta{font-size:12px;color:var(--sub);margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
.tag{display:inline-block;background:#fff0e6;color:var(--new);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;margin-left:4px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:10px 0;font-size:14px;font-weight:600}
.dl{background:var(--acc);color:#fff}
.ios{background:#eef3f0;color:var(--acc)}
#ver{position:fixed;left:12px;bottom:12px;font-size:12px;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#ver.old{color:#c99a00;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.sheet.on{display:flex}
.box{background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:20px 18px 28px;max-height:80vh;overflow:auto}
.box h2{font-size:17px}.box h3{font-size:14px;margin:16px 0 6px}
.box p,.box li{font-size:13px;color:var(--sub);line-height:1.6}
.box ul{padding-left:18px}
.box .act{display:flex;gap:8px;margin-top:14px}
.box button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<div class="top"><h1>내 앱 모음</h1><button class="re" id="re">새로 확인</button></div>
<p class="sub">앱을 업데이트하면 여기 버전이 저절로 바뀌어요</p>
<div id="list"></div>
<button id="ver">v1.1</button>
<div class="sheet" id="sh"><div class="box">
<h2>내 앱 모음 <span id="v2">v1.1</span></h2>
<p id="st">지금 보는 버전이 최신이에요</p>
<h3>업데이트 내용</h3>
<ul><li>11/27 — 버튼 이름을 '웹페이지'로 바꿨어요</li><li>11/27 — 앱 7개를 한곳에서 보고 받을 수 있어요</li></ul>
<h3>개인정보</h3>
<p>이 페이지는 아무 정보도 모으지 않아요. 앱 버전을 확인할 때만 GitHub에 접속해요.</p>
<div class="act"><button id="chk">새 버전 확인</button><button id="cl">닫기</button></div>
</div></div>
<script>
"use strict";
const VER="1.1",OWNER="mini-2026",BASE="https://"+OWNER+".github.io/";
const APPS=[
["gyoche-check","챙김이","교체할 때를 챙겨 주는 앱","app.html","#2f6f4f"],
["dumpu","덤푸","먼슬리·위클리 플래너","app/","#5b5bd6"],
["ganeum","가늠","환율·자주 쓰는 계산기","app/","#c2410c"],
["ieum","이음","듣고 말하고 보는 번역기","","#0e7490"],
["aero","Aero","항공권 정보·출발 시간 안내","app/","#1d4ed8"],
["doodle","Doodle","그린 그림이 움직이는 앱","app/","#db2777"],
["nbbang-qr","N빵","N빵 정산·송금 QR","app/","#7c3aed"]];
const $=id=>document.getElementById(id),KEY="hub-rel",TTL=6e5;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function card(a){
 const [r,n,d,ios,col]=a,c=el("div","card"),row=el("div","row"),ic=el("div","ic",n[0]),t=el("div");
 ic.style.background=col;t.append(el("div","nm",n),el("div","ds",d));
 const m=el("div","meta","버전 확인 중…");m.id="m-"+r;t.append(m);row.append(ic,t);
 const b=el("div","btns"),dl=el("a","dl","다운로드");dl.href=BASE+r+"/";b.append(dl);
 if(ios){const i=el("a","ios","웹페이지");i.href=BASE+r+"/"+ios;b.append(i)}
 c.append(row,b);return c}
function show(r,v){const m=$("m-"+r);if(!m)return;m.textContent="";
 if(!v){m.textContent="버전을 확인하지 못했어요";return}
 const b=el("b",null,v.name.replace(/^.*?(v[\d.]+)\s*$/,"$1")||v.name);m.append(b," · "+v.date.slice(5).replace("-","/")+" 업데이트");
 if(Date.now()-Date.parse(v.date)<3*864e5)m.append(el("span","tag","새 버전"))}
function load(force){
 let c={};try{c=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
 const fresh=!force&&c.t&&Date.now()-c.t<TTL;
 APPS.forEach(([r])=>{
  if(fresh&&c[r]){show(r,c[r]);return}
  fetch("https://api.github.com/repos/"+OWNER+"/"+r+"/releases/latest",{headers:{Accept:"application/vnd.github+json"}})
  .then(x=>x.ok?x.json():null).then(j=>{
   const v=j&&typeof j.name==="string"?{name:j.name.slice(0,40),date:String(j.published_at||"").slice(0,10)}:c[r]||null;
   show(r,v);if(v){c[r]=v;c.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
  }).catch(()=>show(r,c[r]||null))})}
APPS.forEach(a=>$("list").append(card(a)));load(false);
$("re").onclick=()=>load(true);
$("ver").textContent=$("v2").textContent="v"+VER;
$("ver").onclick=()=>$("sh").classList.add("on");
$("cl").onclick=()=>$("sh").classList.remove("on");
$("sh").onclick=e=>{if(e.target===$("sh"))$("sh").classList.remove("on")};
$("chk").onclick=()=>{$("st").textContent="확인 중…";
 fetch("version.txt?"+Date.now(),{cache:"no-store"}).then(x=>x.ok?x.text():"").then(t=>{
  t=t.trim();if(t&&t!==VER){$("st").textContent="새 버전(v"+t+")이 있어요. 잠시 뒤 새로고침돼요";$("ver").classList.add("old");setTimeout(()=>location.reload(),1500)}
  else $("st").textContent="지금 보는 버전이 최신이에요"}).catch(()=>{$("st").textContent="인터넷 연결을 확인해 주세요"})};
</script>
</body>
</html>
